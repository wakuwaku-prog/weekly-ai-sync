name: Auto Weekly Digest + Email

on:
  schedule:
    # Sunday 01:00 UTC = Sunday 09:00 Beijing time
    - cron: '0 1 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install markdown dependency
        run: pip install markdown

      - name: Generate automatic weekly digest
        run: python scripts/generate_auto_report.py

      - name: Generate plant exosome literature digest
        run: python scripts/literature_digest.py --days 7 --extended

      - name: Build static site
        run: python scripts/build_site.py

      - name: Send email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SITE_URL: https://wakuwaku-prog.github.io/weekly-ai-sync/
        run: python scripts/send_email.py

      - name: Commit and push auto-generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weekly site
          if ! git diff --cached --quiet; then
            git commit -m "Auto weekly digest $(date +%F)"
            git push
          else
            echo "No changes to commit."
          fi